name: Rust CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.os }}/${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: packet_loss_monitor-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: packet_loss_monitor-macos
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            binary_name: packet_loss_monitor-windows.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mkdir -p output
          cp target/${{ matrix.target }}/release/packet_loss_monitor* output/${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: output/${{ matrix.binary_name }}
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release')
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: packet_loss_monitor-linux
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: packet_loss_monitor-macos
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: packet_loss_monitor-windows.exe
          path: artifacts

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Set executable permissions
        run: |
          chmod +x artifacts/packet_loss_monitor-linux
          chmod +x artifacts/packet_loss_monitor-macos

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: v$VERSION"

      - name: Create GitHub Release
        id: create_release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Release v${{ steps.version.outputs.version }}" \
            --notes "Automated release of packet-loss-monitor v${{ steps.version.outputs.version }}" \
            --draft=false \
            --prerelease=false \
            --repo ${{ github.repository }}

      - name: Upload Linux binary
        run: gh release upload "v${{ steps.version.outputs.version }}" artifacts/packet_loss_monitor-linux --clobber

      - name: Upload macOS binary
        run: gh release upload "v${{ steps.version.outputs.version }}" artifacts/packet_loss_monitor-macos --clobber

      - name: Upload Windows binary
        run: gh release upload "v${{ steps.version.outputs.version }}" artifacts/packet_loss_monitor-windows.exe --clobber

      - name: Verify release
        run: |
          gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }}
